<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AEGIS CORE PRO | © SCARLET FUENMAYOR</title>
    <link rel="preload" href="perfil.png" as="image">
    <link rel="preload" href="AEGIS.png" as="image">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Orbitron:wght@500;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root { 
            --accent-cyan: #00f2ff;
            --accent-crimson: #d90429;
            --accent-violet: #8a2be2;
            --bg-dark: #050508; 
            --panel-bg: rgba(12, 12, 18, 0.85);
            --border-glow: rgba(0, 242, 255, 0.2);
            --border-crimson: rgba(217, 4, 41, 0.3);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
        
        body, html { 
            background-color: var(--bg-dark); 
            color: #e0e6ed; 
            font-family: 'Orbitron', sans-serif; 
            min-height: 100vh; 
            width: 100vw; 
            overflow-x: hidden;
            display: flex; 
            align-items: center; 
            justify-content: center; 
            background-image: 
                radial-gradient(circle at 50% 15%, rgba(138, 43, 226, 0.12) 0%, transparent 60%),
                radial-gradient(circle at 50% 85%, rgba(0, 242, 255, 0.05) 0%, transparent 50%),
                linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 40px 40px, 40px 40px;
        }

        /* Loader */
        #loader { 
            position: fixed; 
            inset: 0; 
            background: #020204; 
            z-index: 3000; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            transition: opacity 0.6s cubic-bezier(0.4, 0, 0.2, 1); 
        }
        .progress-container { 
            width: 240px; 
            height: 3px; 
            background: rgba(255, 255, 255, 0.05); 
            border-radius: 10px; 
            margin-top: 25px; 
            overflow: hidden; 
            border: 1px solid rgba(0, 242, 255, 0.15); 
        }
        #progress-bar { 
            width: 0%; 
            height: 100%; 
            background: linear-gradient(90deg, var(--accent-violet), var(--accent-cyan)); 
            box-shadow: 0 0 12px var(--accent-cyan); 
            transition: width 0.1s linear; 
        }

        /* Terminal Principal */
        .aegis-terminal {
            width: 92vw; 
            max-width: 480px;
            margin: 20px auto;
            background: var(--panel-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-glow);
            border-radius: 20px; 
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), inset 0 0 20px rgba(0, 242, 255, 0.03);
            display: none; 
            flex-direction: column; 
            align-items: center; 
            padding: 30px 22px;
            position: relative; 
            overflow: hidden;
        }

        .aegis-terminal::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent-cyan), var(--accent-crimson), transparent);
        }

        /* Perfil */
        .profile-box { position: relative; width: 100px; height: 100px; margin-bottom: 14px; }
        .ring { 
            width: 100%; height: 100%; 
            border: 1px solid var(--accent-cyan); 
            border-radius: 50%; 
            padding: 5px; 
            position: relative; 
            box-shadow: 0 0 25px rgba(0, 242, 255, 0.25); 
        }
        .profile-img { 
            width: 100%; height: 100%; 
            border-radius: 50%; 
            background: url('perfil.png') center/cover no-repeat; 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            filter: contrast(1.05) brightness(0.95);
        }
        .laser { 
            position: absolute; 
            width: 100%; 
            height: 2px; 
            background: var(--accent-crimson); 
            box-shadow: 0 0 10px var(--accent-crimson); 
            animation: scan 3s infinite ease-in-out; 
            left: 0; 
            z-index: 5; 
        }
        @keyframes scan { 0% { top: 10%; opacity: 0; } 50% { opacity: 1; } 100% { top: 90%; opacity: 0; } }

        .dev-tag { 
            color: var(--accent-crimson); 
            font-size: 0.65rem; 
            font-weight: 800; 
            letter-spacing: 4px; 
            margin-bottom: 6px; 
            text-shadow: 0 0 10px rgba(217, 4, 41, 0.4); 
        }
        h2 { 
            margin: 0; 
            font-family: 'Cinzel', serif;
            font-size: 1.35rem; 
            letter-spacing: 3px; 
            color: #ffffff; 
            text-align: center; 
            font-weight: 800;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }
        .sync-text { 
            font-family: 'Share Tech Mono', monospace; 
            font-size: 0.68rem; 
            margin: 6px 0 22px; 
            color: var(--accent-cyan); 
            opacity: 0.8; 
            text-transform: uppercase; 
            letter-spacing: 1.5px;
        }

        /* Formulario */
        .input-group { width: 100%; }
        .t-field, .t-area { 
            width: 100%; 
            background: rgba(5, 8, 15, 0.7); 
            border: 1px solid rgba(0, 242, 255, 0.15); 
            border-radius: 10px; 
            padding: 14px 16px; 
            color: #fff; 
            font-family: 'Share Tech Mono', monospace; 
            margin-bottom: 14px; 
            outline: none; 
            font-size: 0.85rem; 
            transition: all 0.3s ease;
        }
        .t-field:focus, .t-area:focus {
            border-color: var(--accent-cyan);
            background: rgba(0, 242, 255, 0.03);
            box-shadow: 0 0 15px rgba(0, 242, 255, 0.15);
        }
        .t-area { height: 75px; resize: none; }

        .btn-main { 
            width: 100%; 
            padding: 16px; 
            border-radius: 10px; 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            background: linear-gradient(135deg, #4a00e0, #8e2de2); 
            color: white; 
            font-weight: 800; 
            font-family: 'Orbitron'; 
            cursor: pointer; 
            font-size: 0.85rem; 
            box-shadow: 0 4px 20px rgba(138, 43, 226, 0.35); 
            text-transform: uppercase; 
            letter-spacing: 2px;
            margin: 5px 0 18px; 
            transition: all 0.3s ease;
        }
        .btn-main:hover {
            box-shadow: 0 6px 25px rgba(138, 43, 226, 0.55);
            transform: translateY(-1px);
        }
        .btn-main:active { transform: translateY(1px); }

        .grid-links { 
            display: none; 
            width: 100%; 
            grid-template-columns: repeat(3, 1fr); 
            gap: 10px; 
            margin-bottom: 18px; 
        }
        .c-link { 
            font-size: 0.6rem; 
            padding: 12px 4px; 
            border-radius: 8px; 
            color: white; 
            text-decoration: none; 
            font-weight: bold; 
            text-align: center; 
            letter-spacing: 1px;
            transition: opacity 0.2s ease, transform 0.2s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .c-link:hover { opacity: 0.9; transform: translateY(-2px); }

        /* SECCIÓN CATÁLOGO */
        .catalog { 
            width: 100%; 
            border-top: 1px solid rgba(255, 255, 255, 0.08); 
            padding-top: 18px; 
            margin-top: 10px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
        }
        .catalog-title { 
            font-size: 0.62rem; 
            color: var(--accent-crimson); 
            margin-bottom: 14px; 
            letter-spacing: 3px; 
            font-weight: 800; 
            text-align: center; 
            text-shadow: 0 0 8px rgba(217, 4, 41, 0.3);
        }
        .catalog-grid { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 10px; 
            width: 100%; 
        }
        .cat-item { 
            font-size: 0.62rem; 
            border: 1px solid rgba(255, 255, 255, 0.06); 
            border-radius: 8px; 
            padding: 12px 8px; 
            background: rgba(255, 255, 255, 0.02); 
            text-transform: uppercase; 
            letter-spacing: 1px; 
            font-weight: 700; 
            text-align: center;
            color: #c8d6e5;
            transition: all 0.3s ease;
        }
        .cat-item:hover {
            border-color: var(--accent-cyan);
            background: rgba(0, 242, 255, 0.04);
            color: #fff;
            box-shadow: 0 0 12px rgba(0, 242, 255, 0.15);
        }

        #phrase { 
            min-height: 32px; 
            font-family: 'Share Tech Mono', monospace; 
            font-size: 0.72rem; 
            margin-top: 18px; 
            text-align: center; 
            color: #fff; 
            text-shadow: 0 0 8px rgba(0, 242, 255, 0.6); 
            letter-spacing: 1px;
        }
        
        /* LOGO FIJO */
        .footer-logo { 
            width: 70px; 
            height: 70px; 
            border: 1px solid rgba(0, 242, 255, 0.3); 
            border-radius: 50%; 
            margin: 18px 0 12px; 
            padding: 6px;
            background: #020204;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.8), 0 0 10px rgba(0, 242, 255, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .footer-logo img { 
            width: 100%; 
            height: 100%;
            object-fit: contain;
            border-radius: 50%; 
            filter: brightness(1.1) contrast(1.1); 
        }
        
        .copy { 
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.55rem; 
            opacity: 0.6; 
            letter-spacing: 1.5px; 
            text-align: center; 
            color: var(--accent-cyan); 
        }
    </style>
</head>
<body>

<div id="loader">
    <div id="load-status" style="letter-spacing: 5px; font-weight: 800; color: var(--accent-cyan); font-size: 0.65rem;">INITIALIZING AEGIS CORE...</div>
    <div class="progress-container"><div id="progress-bar"></div></div>
    <button onclick="boot()" id="ignite-btn" style="margin-top:35px; background: linear-gradient(135deg, var(--accent-crimson), #8a2be2); border: 1px solid rgba(255, 255, 255, 0.2); color:white; padding:12px 38px; font-family:'Orbitron'; border-radius:20px; font-weight:800; cursor:pointer; opacity: 0; display:none; box-shadow: 0 0 25px rgba(217, 4, 41, 0.4); letter-spacing: 2px;">IGNITE CORE</button>
</div>

<div class="aegis-terminal" id="terminal">
    <div class="profile-box">
        <div class="ring"><div class="laser"></div><div class="profile-img"></div></div>
    </div>
    <div class="dev-tag">SR. TECH DEVELOPER</div>
    <h2>SCARLET FUENMAYOR</h2>
    <div class="sync-text">[ UPLINK ACTIVE: <span id="clock">--:--:--</span> ]</div>

    <div class="input-group">
        <input type="text" id="c-name" class="t-field" placeholder="CLIENTE / ENTIDAD">
        <textarea id="c-req" class="t-area" placeholder="DESCRIBA REQUERIMIENTOS TÉCNICOS"></textarea>
        <button class="btn-main" onclick="execute()">ENLAZAR SERVICIOS</button>
        <div class="grid-links" id="links">
            <a id="wa-btn" href="#" target="_blank" class="c-link" style="background: #0f6e5e;">WHATSAPP</a>
            <a id="tg-btn" href="#" target="_blank" class="c-link" style="background: #0077b5;">TELEGRAM</a>
            <a id="em-btn" href="#" class="c-link" style="background: #8b0000;">EMAIL</a>
        </div>
    </div>

    <div class="catalog">
        <div class="catalog-title">[ SERVICIOS DISPONIBLES ]</div>
        <div class="catalog-grid">
            <div class="cat-item">⚙️ SISTEMAS CORE</div>
            <div class="cat-item">🛡️ HARDWARE ARMOR</div>
            <div class="cat-item">💻 DIAGNÓSTICO PCB</div>
            <div class="cat-item">⚡ DEV & AUTOMATION</div>
        </div>
    </div>

    <div id="phrase"></div>
    <div class="footer-logo"><img src="AEGIS.png" alt="AEGIS"></div>
    <div class="copy">
        © 2026 SCARLET FUENMAYOR | AEGIS PROTOCOL
    </div>
</div>

<audio id="bgm" loop preload="auto"><source src="musica.mp3" type="audio/mpeg"></audio>

<script>
    const bgm = document.getElementById('bgm');
    const bar = document.getElementById('progress-bar');
    const ignite = document.getElementById('ignite-btn');
    const status = document.getElementById('load-status');

    let width = 0;
    let interval = setInterval(() => {
        if (width >= 100) {
            clearInterval(interval);
            status.innerHTML = "SYSTEM READY";
            ignite.style.display = 'block';
            setTimeout(() => ignite.style.opacity = '1', 50);
        } else {
            width += 2;
            bar.style.width = width + '%';
        }
    }, 20); 

    function boot() {
        bgm.play().catch(e => console.log("Audio trigger failed"));
        document.getElementById('loader').style.opacity = '0';
        setTimeout(() => {
            document.getElementById('loader').style.display = 'none';
            document.getElementById('terminal').style.display = 'flex';
            type();
        }, 600);
    }

    setInterval(() => { 
        document.getElementById('clock').innerText = new Date().toLocaleTimeString('es-VE', {
            hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true
        }); 
    }, 1000);

    const txt = "EL PRESENTE ES HOY Y ESTÁ A TU ALCANCE AHORA";
    let n = 0;
    function type() { 
        if(n < txt.length) { 
            document.getElementById('phrase').innerHTML += txt.charAt(n); 
            n++; 
            setTimeout(type, 45); 
        } 
    }

    async function execute() {
        const u = document.getElementById('c-name').value;
        const r = document.getElementById('c-req').value;
        if(!u || !r) return;
        document.getElementById('links').style.display = 'grid';
        document.getElementById('phrase').innerHTML = "<span style='color:var(--accent-crimson)'>[ SINCRONIZANDO NÚCLEO... ]</span>";
        
        const msg = `🚨 *ALERTA AEGIS PRO*%0A*CLIENTE:* ${u}%0A*REQ:* ${r}`;
        const token = "8584036667:AAE3Scxy03MuZrtzFQbGPPSh332kpxvFElI";
        fetch(`https://api.telegram.org/bot${token}/sendMessage?chat_id=584248364108&text=${msg}&parse_mode=Markdown`);

        document.getElementById('wa-btn').href = `https://wa.me/584248364108?text=${msg}`;
        document.getElementById('em-btn').href = `mailto:Fuenmayorscarlet610@gmail.com?subject=AEGIS: ${u}&body=${r}`;
        document.getElementById('tg-btn').href = `https://t.me/AegisSystem_Bot?text=${msg}`;
        
        setTimeout(() => { document.getElementById('phrase').innerHTML = "SISTEMA EN LÍNEA. SELECCIONE CANAL."; }, 1000);
    }
</script>
</body>
    </html>
